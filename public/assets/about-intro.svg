<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="ab-t ab-d">
  <title id="ab-t">About Muhammad Hateem Hussain</title>
  <desc id="ab-d">Software Engineer and Co-Founder and COO of CodeBettle. B.Sc. in Software Engineering at University of Agriculture Faisalabad, CGPA 3.21. Python Trainer at CodeBettle, Jul 2024 to present, 1,500+ students, 5 cohorts; ICodeGuru, Aug 2022 to Mar 2026, 1,000+ learners. Shipped CodeBettle Web, Global Study Abroad Platform, SafeSubmit and Zero-Day IDS. Primary language Python; ML with TensorFlow/Keras; drawn to system design, teaching, and machine learning.</desc>
